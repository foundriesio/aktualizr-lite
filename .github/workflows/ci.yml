name: Aklite CI Tests
on:
  push:
  pull_request:
    branches:
      - master

permissions:
  checks: write
  pull-requests: write
  contents: read
  packages: write

jobs:
  clang:
    name: Clang Format And Tidy
    runs-on: ubuntu-latest
    container:
      image: foundries/aklite-dev:ubuntu-26.10
      env:
        CXX: clang++
        CC: clang

    steps:
      - uses: actions/checkout@v4
      - run: git config --global --add safe.directory /__w/aktualizr-lite/aktualizr-lite
      - run: git submodule update --init --recursive
      - name: config
        run: make -f dev-flow.mk config
      - name: format
        run: make -f dev-flow.mk format
      - name: tidy
        run: make -f dev-flow.mk tidy

  refresh-ccache-dev:
    name: Refresh ccache for development environment
    runs-on: ubuntu-latest
    container:
      image: foundries/aklite-dev:ubuntu-26.10
      env:
        CXX: clang++
        CC: clang
        CCACHE_DIR: /__w/aktualizr-lite/aktualizr-lite/.ccache

    steps:
      - uses: actions/checkout@v4
      - run: git config --global --add safe.directory /__w/aktualizr-lite/aktualizr-lite
      - run: git submodule update --init --recursive
      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: /__w/aktualizr-lite/aktualizr-lite/.ccache
          key: dev-ccache-${{ github.sha }}
          restore-keys: |
            dev-ccache-
      - name: build
        run: make -f dev-flow.mk config build

  refresh-ccache-e2e:
    name: Refresh ccache for e2e tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - run: git config --global --add safe.directory ${{ github.workspace }}
      - run: git submodule update --init --recursive
      
      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.ccache
          key: e2e-ccache-${{ github.sha }}
          restore-keys: |
            e2e-ccache-
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Check if image exists # Fallback to master image if branch-specific image doesn't exist
        id: check_image
        run: |
          # build-e2e-image.yml tags images with "/" replaced by "-" in the branch name
          # (a literal "/" isn't a valid Docker tag character) - match that here too.
          # On pull_request events GITHUB_REF_NAME is "<number>/merge"; GITHUB_HEAD_REF is the branch.
          BRANCH="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          SAFE_BRANCH="${BRANCH//\//-}"
          if docker manifest inspect ghcr.io/${{ github.repository }}/aklite-e2e-test:$SAFE_BRANCH > /dev/null 2>&1; then
            echo "AKLITE_E2E_IMAGE=ghcr.io/${{ github.repository }}/aklite-e2e-test:$SAFE_BRANCH" >> $GITHUB_ENV
          else
            echo "AKLITE_E2E_IMAGE=ghcr.io/${{ github.repository }}/aklite-e2e-test:master" >> $GITHUB_ENV
          fi
      - run: ./dev-shell-e2e-test.sh make -f dev-flow.mk config build
        env:
          AKLITE_E2E_IMAGE: ${{ env.AKLITE_E2E_IMAGE }}

  garage-tools:
    name: Build Garage Tools
    runs-on: ubuntu-latest
    needs: refresh-ccache-dev
    container:
      image: foundries/aklite-dev:ubuntu-26.10
      env:
        CXX: clang++
        CC: clang
        CCACHE_DIR: /__w/aktualizr-lite/aktualizr-lite/.ccache

    steps:
      - uses: actions/checkout@v3
      - run: git config --global --add safe.directory /__w/aktualizr-lite/aktualizr-lite
      - run: git submodule update --init --recursive
      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: /__w/aktualizr-lite/aktualizr-lite/.ccache
          key: dev-ccache-garage-${{ github.sha }}
          restore-keys: |
            dev-ccache-garage-
            dev-ccache-
      - name: build garage tools
        run: make -f dev-flow.mk garage-tools
      - name: check garage tools
        run: |
          if [[ ! -f build-garage/aktualizr/src/sota_tools/garage-sign/bin/garage-sign ]]; then
            echo "Failed to build garage-sign!"
            exit 1
          fi
          if [[ ! -f build-garage/aktualizr/src/sota_tools/garage-push ]]; then
            echo "Failed to build garage-push!"
            exit 1
          fi

  test:
    name: Tests
    needs: refresh-ccache-dev
    runs-on: ubuntu-latest
    container:
      image: foundries/aklite-dev:ubuntu-26.10
      env:
        CXX: clang++
        CC: clang
        CCACHE_DIR: /__w/aktualizr-lite/aktualizr-lite/.ccache
    steps:
      - uses: actions/checkout@v3
      - run: git config --global --add safe.directory /__w/aktualizr-lite/aktualizr-lite
      - run: git submodule update --init --recursive
      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: /__w/aktualizr-lite/aktualizr-lite/.ccache
          key: dev-ccache-${{ github.sha }}
          restore-keys: |
            dev-ccache-
      - name: test
        run: make -f dev-flow.mk config build test

  e2e-test:
    name: ${{ matrix.name }}
    needs: refresh-ccache-e2e
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Basic online, single step end-to-end tests
            tests: "test_incremental_updates[False-True or test_update_to_latest[False-True"
          - name: Basic online, granular steps, no delay start apps end-to-end tests
            tests: "test_incremental_updates[False-False-False or test_update_to_latest[False-False"
          - name: Basic online, granular steps, delay start apps end-to-end tests
            tests: "test_incremental_updates[False-False-True"
          - name: Basic offline, single step end-to-end tests
            tests: "test_incremental_updates[True-True or test_update_to_latest[True-True"
          - name: Basic offline, granular steps, no delay start apps end-to-end tests
            tests: "test_incremental_updates[True-False-False or test_update_to_latest[True-False"
          - name: Basic offline, granular steps, delay start apps end-to-end tests
            tests: "test_incremental_updates[True-False-True"
          - name: End-to-end tests additional set
            tests: "test_no_space[False or test_no_space_reserved_storage[False or test_reserved_storage_low_allows_update[False or test_forced_sync or test_bad_network or test_kill_process"
          - name: SoftHSM-backed device end-to-end tests
            tests: "test_update_to_latest[False-True or test_update_to_latest[False-False or test_update_to_latest[True-False or test_fiopull_interrupt_resume"
            softhsm: true
    uses: ./.github/workflows/e2e-tests.yml
    with:
      tests: ${{ matrix.tests }}
      softhsm: ${{ matrix.softhsm || false }}
    secrets: inherit
