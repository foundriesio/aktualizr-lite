name: End-to-end tests

on:
  workflow_call:
    inputs:
      tests:
        description: pytest -k expression selecting the tests to run
        type: string
        required: true
      softhsm:
        description: Register the device with its mTLS key and cert on a SoftHSM token
        type: boolean
        default: false

jobs:
  e2e:
    name: pytest
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - run: git config --global --add safe.directory ${{ github.workspace }}
      - run: git submodule update --init --recursive
      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.ccache
          key: e2e-ccache-${{ github.sha }}
          restore-keys: |
            e2e-ccache-
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Check if image exists # Fallback to master image if branch-specific image doesn't exist
        id: check_image
        run: |
          # build-e2e-image.yml tags images with "/" replaced by "-" in the branch name
          # (a literal "/" isn't a valid Docker tag character) - match that here too.
          # On pull_request events GITHUB_REF_NAME is "<number>/merge"; GITHUB_HEAD_REF is the branch.
          BRANCH="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          SAFE_BRANCH="${BRANCH//\//-}"
          if docker manifest inspect ghcr.io/${{ github.repository }}/aklite-e2e-test:$SAFE_BRANCH > /dev/null 2>&1; then
            echo "AKLITE_E2E_IMAGE=ghcr.io/${{ github.repository }}/aklite-e2e-test:$SAFE_BRANCH" >> $GITHUB_ENV
          else
            echo "AKLITE_E2E_IMAGE=ghcr.io/${{ github.repository }}/aklite-e2e-test:master" >> $GITHUB_ENV
          fi
      - run: ./dev-shell-e2e-test.sh make -f dev-flow.mk config build
        env:
          AKLITE_E2E_IMAGE: ${{ env.AKLITE_E2E_IMAGE }}
      - run: ./dev-shell-e2e-test.sh pytest docker-e2e-test/e2e-test.py -k "$E2E_TESTS"
        env:
          E2E_TESTS: ${{ inputs.tests }}
          AKLITE_E2E_IMAGE: ${{ env.AKLITE_E2E_IMAGE }}
          FACTORY: ${{ secrets.E2E_TEST_FACTORY }}
          USER_TOKEN: ${{ secrets.E2E_TEST_USER_TOKEN }}
          TAG: ${{ secrets.E2E_TEST_TAG }}
          E2E_TEST_OSTREE_TGZ: ${{ secrets.E2E_TEST_OSTREE_TGZ }}
          USE_SOFTHSM: ${{ inputs.softhsm && '1' || '' }}
