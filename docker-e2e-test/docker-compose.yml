version: '3.8'

services:
  # Self-hosted stand-in for the real Foundries.io Factory backend, used only by the
  # update-server e2e backend (opt-in via `--profile update-server`; the default Foundries
  # Factory-backed flow does not start this service).
  update-server:
    build:
      context: ./update-server
    image: ${UPDATE_SERVER_IMAGE:-aklite-e2e-update-server}
    volumes:
      - update-server-data:/data
    ports:
      - "8080:8080"
    profiles:
      - update-server

  # Throwaway registry used only to build/publish the update-server backend's compose apps
  # locally (see docker-e2e-test/registry/entrypoint.sh for why it needs real TLS). Same
  # opt-in profile as `update-server`.
  registry:
    build:
      context: ./registry
    image: ${E2E_REGISTRY_IMAGE:-aklite-e2e-registry}
    volumes:
      - registry-certs:/certs
      - registry-data:/var/lib/registry
    profiles:
      - update-server

  dockerd:
    image: ghcr.io/foundriesio/moby:25.0.3_fio
    # Trust the `registry` service's self-signed cert (only present when the update-server
    # profile populated the shared volume) before starting the real daemon, so `docker push`
    # against it succeeds. A no-op for the default Foundries Factory-backed flow.
    entrypoint: ["sh", "-c"]
    command:
      # Poll briefly rather than a one-shot check: `registry` has no explicit start-order
      # relative to this service (that would break the default, registry-less flow, which
      # can't depend on a profile-gated service), so its cert may not exist yet. Bounded at
      # ~5s so the default flow (where the cert never appears) pays only a small, fixed cost.
      - >-
        for i in $(seq 1 10); do [ -f /registry-certs/registry.crt ] && break; sleep 0.5; done;
        if [ -f /registry-certs/registry.crt ]; then
          apk add --no-cache ca-certificates >/dev/null 2>&1;
          cp /registry-certs/registry.crt /usr/local/share/ca-certificates/e2e-registry.crt;
          update-ca-certificates;
        fi;
        exec dockerd -H unix:///var/run/docker/docker.sock
    volumes:
      - ${DOCKER_DATA_ROOT}:/var/lib/docker
      - docker-runtime:/var/run/docker
      - ${SOTA_DIR}:/var/sota
      - registry-certs:/registry-certs
    privileged: true

  aklite-e2e-test:
      build:
        context: ${AKLITE_E2E_TEST_DOCKER_DIR}
        args:
          AKLITE_VER: master
        dockerfile: Dockerfile

      image: ${AKLITE_E2E_IMAGE:-aklite-e2e-test}
      volumes:
        - "${PWD}:${PWD}"
        - ${SYSROOT}:/sysroot
        - ${SYSROOT}/ostree:/ostree
        - ${BOOTDIR}:/boot
        - ${SOTA_DIR}:/var/sota
        - ${USR_SOTA_DIR}:/usr/lib/sota/conf.d
        - ${ETC_SOTA_DIR}:/etc/sota/conf.d
        - ${DOCKER_DATA_ROOT}:/var/lib/docker
        - docker-runtime:/var/run/docker
        - ${CCACHE_DIR:-${PWD}/.ccache}:${CCACHE_DIR:-${PWD}/.ccache}
        - registry-certs:/registry-certs
      working_dir: "${PWD}"
      hostname: device
      user: "root"
      environment:
        - FACTORY=${FACTORY}
        - AUTH_TOKEN=${AUTH_TOKEN}
        - DEVICE_TAG=${DEVICE_TAG}
        - DOCKER_HOST=unix:///var/run/docker/docker.sock
        - DOCKER_CONFIG=/usr/lib/docker
        - CXX=clang++
        - CC=clang
      depends_on:
      - dockerd

volumes:
  docker-runtime:
  update-server-data:
  registry-certs:
  registry-data:
